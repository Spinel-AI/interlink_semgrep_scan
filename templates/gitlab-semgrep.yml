# GitLab CI template for Semgrep SAST
# ─────────────────────────────────────────────────────────────────────────────
# Usage: add to your project's .gitlab-ci.yml:
#
#   include:
#     - project: 'security/semgrep-cicd'
#       ref: main
#       file: '/templates/gitlab-semgrep.yml'
#
#   stages:
#     - scan
#     - build
#     - deploy
#
#   variables:
#     SEMGREP_RULES_REPO: "security/semgrep-cicd"
#     SEMGREP_RULES_REF: "main"
#     SEMGREP_FAIL_ON_FINDINGS: "true"
# ─────────────────────────────────────────────────────────────────────────────

variables:
  SEMGREP_RULES_REPO:
    value: "security/semgrep-cicd"
    description: "GitLab project path of the shared Semgrep rules repo"
  SEMGREP_RULES_REF:
    value: "main"
    description: "Branch or tag of the rules repo to clone"
  SEMGREP_FAIL_ON_FINDINGS:
    value: "true"
    description: "Fail the pipeline on High/Critical findings (semgrep ERROR severity). Medium and Info never fail the pipeline. Set to 'false' to report without failing."

semgrep_scan:
  stage: scan
  # Pinned by digest: the :1.162.0 tag itself can be repointed on Docker Hub,
  # and this container gets the project source mounted into it.
  image: semgrep/semgrep:1.162.0@sha256:9349edbadf90c3f3c0c3f55867625354e89680e6fa10d9034042af52fdb0e0d0
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - echo "==> Cloning shared rules: ${SEMGREP_RULES_REPO}@${SEMGREP_RULES_REF}"
    - |
      git clone \
        --depth 1 \
        --branch "${SEMGREP_RULES_REF}" \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${SEMGREP_RULES_REPO}.git" \
        /tmp/semgrep-rules
    - echo "==> Rules cloned. Files:"
    - find /tmp/semgrep-rules/rules -name "*.yml" | sort
  script:
    - |
      echo "==> Starting Semgrep SAST scan..."
      echo "    Project:  ${CI_PROJECT_PATH}"
      echo "    Commit:   ${CI_COMMIT_SHORT_SHA}"
      echo "    Ref:      ${CI_COMMIT_REF_NAME}"
      echo "    Fail on:  ${SEMGREP_FAIL_ON_FINDINGS}"

      BASE_ARGS="
        --config auto
        --config /tmp/semgrep-rules/rules
        --gitlab-sast
        --output gl-sast-report.json
        --exclude node_modules
        --exclude dist
        --exclude build
        --exclude .next
        --exclude .nuxt
        --exclude coverage
        --exclude generated
        --exclude .turbo
        --no-rewrite-rule-ids
        --verbose
        .
      "

      # No --error here. It exits non-zero on ANY finding, which under GitLab's
      # set -e would both abort before the summary below and fail the pipeline
      # on Medium/Info findings. Severity gating is decided from the report.
      SCAN_RC=0
      semgrep scan $BASE_ARGS || SCAN_RC=$?

      # Semgrep exits >= 2 on an engine error (bad config, parse failure).
      if [ "$SCAN_RC" -ge 2 ]; then
        echo "==> Semgrep engine error (exit ${SCAN_RC}). Failing the pipeline."
        exit "$SCAN_RC"
      fi

      if [ ! -f gl-sast-report.json ]; then
        echo "==> Semgrep produced no report. Failing closed."
        exit 1
      fi

      # semgrep 1.162.0 maps ERROR -> High, WARNING -> Medium, INFO -> Info in
      # the GitLab SAST schema. Critical is included for forward compatibility.
      # No fallback to 0: an unreadable report must fail the gate closed rather
      # than green-light a dirty repo.
      COUNTS=$(python3 -c "
      import json
      from collections import Counter
      data = json.load(open('gl-sast-report.json'))
      vulns = data.get('vulnerabilities', [])
      c = Counter(v.get('severity', 'Unknown') for v in vulns)
      blocking = c['Critical'] + c['High']
      print(len(vulns), blocking, c['Critical'], c['High'], c['Medium'], c['Low'] + c['Info'] + c['Unknown'])
      ")
      PARSE_RC=$?

      if [ "$PARSE_RC" -ne 0 ]; then
        echo "==> Could not parse gl-sast-report.json (rc=${PARSE_RC}). Failing closed."
        exit 1
      fi

      set -- $COUNTS
      TOTAL="$1"; BLOCKING="$2"; CRITICAL="$3"; HIGH="$4"; MEDIUM="$5"; LOW="$6"

      echo "==> Scan complete."
      echo "    Total:              ${TOTAL}"
      echo "    Critical:           ${CRITICAL}"
      echo "    High:               ${HIGH}"
      echo "    Medium:             ${MEDIUM}"
      echo "    Low/Info:           ${LOW}"
      echo "    Blocking (Crit+Hi): ${BLOCKING}"

      if [ "$SEMGREP_FAIL_ON_FINDINGS" != "true" ]; then
        echo "==> SEMGREP_FAIL_ON_FINDINGS is not 'true' — reporting only."
        exit 0
      fi

      if [ "$BLOCKING" -gt 0 ]; then
        echo "==> Blocking pipeline: ${BLOCKING} Critical/High finding(s)."
        exit 1
      fi

      echo "==> No Critical/High findings. Medium and Low/Info do not block."
      exit 0
  artifacts:
    name: "semgrep-sast-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 30 days
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
  allow_failure: false
