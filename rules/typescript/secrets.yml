rules:
  # ──────────────────────────────────────────────
  # PRIVATE KEYS & CERTIFICATES
  # ──────────────────────────────────────────────

  - id: ts.secrets.private-key
    pattern-regex: '-----BEGIN\s+(RSA|EC|DSA|OPENSSH|PGP|ENCRYPTED)\s+PRIVATE KEY-----'
    message: >
      A private key is embedded in source code. Private keys must NEVER be committed to a repository.
      Immediately rotate the key, audit git history (including all branches), and store keys
      in a secrets manager (Vault, AWS Secrets Manager, GitLab CI variables with masking).
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-321
      confidence: HIGH

  # ──────────────────────────────────────────────
  # AWS CREDENTIALS
  # ──────────────────────────────────────────────

  - id: ts.secrets.aws-access-key-id
    pattern-regex: '(AKIA|ABIA|ACCA|ASIA)[A-Z0-9]{16}'
    message: >
      An AWS Access Key ID pattern was found in source code.
      Immediately revoke this key in the AWS IAM console, audit CloudTrail for unauthorized usage,
      and store credentials in environment variables or AWS IAM roles instead.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  - id: ts.secrets.aws-secret-key-assignment
    patterns:
      - pattern-either:
          - pattern: $AWS_SECRET = "..."
          - pattern: secretAccessKey = "..."
          - pattern: aws_secret_access_key = "..."
          - pattern: |
              {
                secretAccessKey: "...",
                ...
              }
    message: >
      AWS Secret Access Key appears to be hardcoded in source code.
      Rotate the key immediately and use IAM roles or environment variables:
      `secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY`.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: MEDIUM

  # ──────────────────────────────────────────────
  # CREDENTIALS IN CONNECTION STRINGS
  # ──────────────────────────────────────────────

  - id: ts.secrets.credentials-in-url
    pattern-regex: '(mongodb|redis|postgresql|postgres|mysql|amqp|amqps):\/\/[^:@\s]+:[^@\s]+@'
    message: >
      A database or broker connection URL contains embedded credentials (username:password@host).
      Hardcoded credentials in URLs are exposed in git history, logs, and error messages.
      Move credentials to environment variables and construct the URL at runtime:
      `${process.env.DB_USER}:${process.env.DB_PASS}@host`.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  # ──────────────────────────────────────────────
  # GITHUB / GITLAB TOKENS
  # ──────────────────────────────────────────────

  - id: ts.secrets.github-token
    pattern-regex: 'gh[pousr]_[A-Za-z0-9_]{36,255}'
    message: >
      A GitHub personal access token (PAT) was found in source code.
      Revoke the token immediately at https://github.com/settings/tokens
      and use environment variables or CI/CD secret injection instead.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  - id: ts.secrets.gitlab-token
    pattern-regex: 'glpat-[A-Za-z0-9\-_]{20,}'
    message: >
      A GitLab personal access token (glpat-*) was found in source code.
      Revoke the token immediately in your GitLab profile settings and use
      CI/CD masked variables or a secrets manager instead.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  # ──────────────────────────────────────────────
  # GOOGLE / FIREBASE
  # ──────────────────────────────────────────────

  - id: ts.secrets.google-api-key
    pattern-regex: 'AIza[0-9A-Za-z\-_]{35}'
    message: >
      A Google API key (`AIza...`) was found in source code.
      Restrict the key's usage in the Google Cloud Console and rotate it if it was exposed.
      Use environment variables to inject the key at runtime.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  - id: ts.secrets.firebase-service-account
    pattern-regex: '"type"\s*:\s*"service_account"'
    message: >
      A Firebase/GCP service account JSON key appears to be embedded in source code.
      Service account files grant broad access and must never be committed.
      Use Application Default Credentials (ADC) or inject via environment variables.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  # ──────────────────────────────────────────────
  # SLACK / STRIPE / SENDGRID TOKENS
  # ──────────────────────────────────────────────

  - id: ts.secrets.slack-token
    pattern-regex: 'xox[baprs]-[0-9A-Za-z\-]+'
    message: >
      A Slack token (`xox*-...`) was found. Revoke it at https://api.slack.com/apps
      and use environment variables instead.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  - id: ts.secrets.stripe-secret-key
    pattern-regex: 'sk_(live|test)_[0-9a-zA-Z]{24,}'
    message: >
      A Stripe secret key was found in source code. Revoke it in the Stripe dashboard
      immediately — live keys can be used to make charges and issue refunds.
      Use environment variables: `process.env.STRIPE_SECRET_KEY`.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  - id: ts.secrets.sendgrid-api-key
    pattern-regex: 'SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43}'
    message: >
      A SendGrid API key was found in source code. Revoke it in the SendGrid console
      and inject via environment variable instead.
    languages: [typescript, javascript, generic]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH

  # ──────────────────────────────────────────────
  # GENERIC PATTERNS
  # ──────────────────────────────────────────────

  - id: ts.secrets.generic-api-key
    patterns:
      - pattern-either:
          - pattern: apiKey = "..."
          - pattern: api_key = "..."
          - pattern: apiSecret = "..."
          - pattern: api_secret = "..."
          - pattern: accessToken = "..."
          - pattern: access_token = "..."
          - pattern: clientSecret = "..."
          - pattern: client_secret = "..."
          - pattern: |
              {
                apiKey: "...",
                ...
              }
          - pattern: |
              {
                secretKey: "...",
                ...
              }
    message: >
      A credential-related variable is assigned a hardcoded string literal.
      Secrets must not be stored in source code. Use environment variables, a secrets manager,
      or CI/CD masked variables to inject credentials at runtime.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: MEDIUM

  - id: ts.secrets.hardcoded-password
    patterns:
      - pattern-either:
          - pattern: password = "..."
          - pattern: passwd = "..."
          - pattern: PASSWORD = "..."
          - pattern: |
              {
                password: "...",
                ...
              }
    message: >
      A `password` variable is assigned a hardcoded string literal.
      Hardcoded passwords are exposed in source code and git history.
      Use environment variables or a secrets manager to inject the password at runtime.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: secrets
      cwe: CWE-259
      confidence: MEDIUM
