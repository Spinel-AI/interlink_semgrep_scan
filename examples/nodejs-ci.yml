# Copy this file to your project at: .github/workflows/ci.yml
#
# Requirement: the security-scan job runs on a SELF-HOSTED runner, pinned by the
# reusable workflow and not overridable by callers. That runner must have both
# `python3` and `docker` available or the job fails its preflight check. Without
# a self-hosted runner registered, the job queues indefinitely.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-scan:
    name: Security Scan (Semgrep)
    permissions:
      contents: read
      security-events: write
    uses: Spinel-AI/interlink_semgrep_scan/.github/workflows/semgrep.yml@main
    with:
      # Only ERROR-severity findings block the build. WARNING and INFO are
      # reported to Telegram and the Security tab but never fail the job.
      fail-on-findings: true
    # Pass only the secrets this workflow declares. `secrets: inherit` would
    # hand it every secret in your repository.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Build TypeScript (if applicable)
        run: npm run build --if-present

      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag app:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      # -- Option A: SSH + Docker pull --
      # - uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #       docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
      #       docker stop app || true
      #       docker run -d --name app --restart unless-stopped \
      #         -p 3000:3000 \
      #         ghcr.io/${{ github.repository }}:${{ github.sha }}

      # -- Option B: AWS ECS --
      # - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   with:
      #     task-definition: task-definition.json
      #     service: your-service
      #     cluster: your-cluster

      - run: echo "Add your deploy step above"
