      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./build

      # -- Option B: S3 + CloudFront --
      # - name: Deploy to S3
      #   run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET }} --delete
